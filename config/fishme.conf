# FishMe Configuration File
# This file stores global settings for the FishMe phishing  tool

[server]
# Default server settings
default_host=127.0.0.1
default_port=8080

[tunnel]
# Tunnel settings
default_tunnel=cloudflare
cloudflare_token_file=.cf_token
localxpose_token_file=.loclx_token

[paths]
# Directory paths
templates_dir=templates
capture_dir=capture
logs_dir=logs
config_dir=config
sessions_dir=sessions
exports_dir=exports

[logging]
# Logging settings
log_level=info
log_file=logs/fishme.log
max_log_size=10M
log_retention_days=7

[templates]
# Template settings
default_template=facebook
auto_update_templates=false
template_cache_dir=.cache/templates

[capture]
# Capture data settings
capture_format=json
auto_export=false
export_format=csv
export_dir=exports

[ui]
# User interface settings
color_output=true
show_banner=true
confirm_destructive=true

[security]
# Security settings
sanitize_input=true
validate_urls=true
max_captures_per_session=1000
session_timeout=3600
